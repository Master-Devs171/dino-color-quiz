name: Validar jogos DinoPlay
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-contribution.mjs
      - run: node scripts/validate-catalog.mjs
      - run: node scripts/scan-community-security.mjs
      - run: node scripts/test-platform-contracts.mjs
      - run: node scripts/test-i18n.mjs
      - run: node scripts/test-multiplayer-presence.mjs
      - run: node scripts/run-community-tests.mjs
      - run: node scripts/validate-play-release.mjs
