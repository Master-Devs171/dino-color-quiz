name: Validar jogos DinoPlay
on:
  pull_request:
    paths: ['games/**','sdk/**','scripts/validate-catalog.mjs']
  push:
    branches: [main]
    paths: ['games/**','sdk/**','scripts/validate-catalog.mjs']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-catalog.mjs
